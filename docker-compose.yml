services:
  telegram-assistant:
    build: {context: .}
    image: telecalendar-assistant:local
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 64
    env_file: [.env]
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    networks: [assistant-internal]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  google-auth:
    profiles: [tools]
    build: {context: .}
    image: telecalendar-assistant:local
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    env_file: [.env]
    environment:
      GOOGLE_OAUTH_BIND_ADDR: 0.0.0.0
    volumes: ["./secrets:/secrets"]
    ports: ["127.0.0.1:8080:8080"]
    command: ["python", "-m", "scripts.google_auth"]
    cap_drop: [ALL]

networks:
  assistant-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
